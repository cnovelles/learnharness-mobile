# Visual and demo artifacts (issue 19, D-018). The session "Artifacts check"
# shows a figure (invert switch, full-screen viewer), the slider demo, a
# figure on a learner photo, a demo with a script from jsDelivr, a demo with
# a blocked host, a failed demo and the canary demo. The canary demo tries
# each escape of the security review (docs/reviews/2026-11-23-artifact-sandbox.md,
# section 8). Pass: no hit on the canary servers, no native panel, and the
# app stays on the lesson.
# It needs:
#   1. The test Mac with the artifacts session: LH_E2E_ARTIFACTS=1 npm run e2e:mac
#   2. Metro: npx expo start --clear
#   3. The development build on the booted Simulator, with internet (jsDelivr).
# Run: sh scripts/e2e-test.sh e2e/artifacts.yaml
appId: dev.local.learnharnessmobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Or paste the pairing text"
    timeout: 120000
- tapOn:
    id: "pairing-text"
- inputText: ${PAIRING}
- tapOn: "Or paste the pairing text"
- tapOn:
    id: "pair"
- extendedWaitUntil:
    visible: "Connected · Test Mac"
    timeout: 30000
# Tap the row (its label ends with the concept count), not the card title.
- extendedWaitUntil:
    visible: "Artifacts check.+"
    timeout: 30000
- tapOn: "Artifacts check.+"
# 1. The figure: drawn, the invert switch saves on the Mac, the viewer opens.
- extendedWaitUntil:
    visible:
      id: "artifact-sa_steer_job_e2e_figure-webview"
    timeout: 30000
- assertVisible: "FIGURE"
- takeScreenshot: artifacts-1-figure
- tapOn:
    id: "artifact-sa_steer_job_e2e_figure-invert"
- waitForAnimationToEnd
- assertNotVisible: "Could not save the switch\\."
- takeScreenshot: artifacts-2-figure-inverted
- tapOn:
    id: "artifact-sa_steer_job_e2e_figure-expand"
- extendedWaitUntil:
    visible:
      id: "zoom-viewer"
    timeout: 10000
- takeScreenshot: artifacts-3-figure-viewer
- tapOn:
    id: "zoom-close"
- extendedWaitUntil:
    notVisible:
      id: "zoom-viewer"
    timeout: 10000
# 2. The slider demo runs in the sheet after a tap.
- scrollUntilVisible:
    element:
      id: "artifact-sa_steer_job_e2e_slider-run"
    direction: DOWN
- tapOn:
    id: "artifact-sa_steer_job_e2e_slider-run"
- extendedWaitUntil:
    visible:
      id: "artifact-sa_steer_job_e2e_slider-webview"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*Pull: 4\\.0.*"
    timeout: 15000
- takeScreenshot: artifacts-4-slider-demo
- tapOn:
    id: "artifact-sa_steer_job_e2e_slider-done"
- waitForAnimationToEnd
# 3. The figure on the learner photo (the image route of the Mac).
- scrollUntilVisible:
    element:
      id: "artifact-sa_steer_job_e2e_photo-webview"
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: "artifact-sa_steer_job_e2e_photo-photo-error"
- takeScreenshot: artifacts-5-photo
# 4. The demo with a script from jsDelivr (an allowed CDN host).
- scrollUntilVisible:
    element:
      id: "artifact-sa_steer_job_e2e_cdn-run"
    direction: DOWN
- tapOn:
    id: "artifact-sa_steer_job_e2e_cdn-run"
- extendedWaitUntil:
    visible: ".*Library loaded: 2 chunks.*"
    timeout: 30000
- takeScreenshot: artifacts-6-cdn-demo
- tapOn:
    id: "artifact-sa_steer_job_e2e_cdn-done"
- waitForAnimationToEnd
# 5. The blocked host and the failed demo show a note, no WebView.
- scrollUntilVisible:
    element: "This demo needs a file from the internet that the phone blocks\\. Open it on the Mac\\."
    direction: DOWN
- scrollUntilVisible:
    element: "The demo could not be built\\."
    direction: DOWN
- takeScreenshot: artifacts-7-notes
# 6. The canary demo. No native panel shows, and the app stays on the lesson.
- scrollUntilVisible:
    element:
      id: "artifact-sa_steer_job_e2e_canary-run"
    direction: DOWN
- tapOn:
    id: "artifact-sa_steer_job_e2e_canary-run"
- extendedWaitUntil:
    visible: ".*Canary finished.*"
    timeout: 30000
- assertNotVisible: ".*CANARY (ALERT|CONFIRM|PROMPT|FRAME PROMPT).*"
- takeScreenshot: artifacts-8-canary
# Give the WebRTC tries time to send a STUN request.
- swipe:
    start: 50%, 60%
    end: 50%, 40%
    duration: 400
- takeScreenshot: artifacts-9-canary-list
- runScript:
    file: scripts/canary.js
    env:
      CONTROL: ${CONTROL}
- assertVisible:
    id: "artifact-sa_steer_job_e2e_canary-webview"
- tapOn:
    id: "artifact-sa_steer_job_e2e_canary-done"
- waitForAnimationToEnd
- assertVisible:
    id: "artifact-sa_steer_job_e2e_canary"
- assertNotVisible: ".*CANARY (ALERT|CONFIRM|PROMPT|FRAME PROMPT).*"
- takeScreenshot: artifacts-10-back-on-lesson
