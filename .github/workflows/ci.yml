name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Same folder layout as on the Mac: the tests read ../learnharness.
      - uses: actions/checkout@v4
        with:
          path: learnharness-mobile
      - uses: actions/checkout@v4
        with:
          repository: cnovelles/learnharness
          ref: mobile/phone-access
          path: learnharness
      - uses: actions/setup-node@v4
        with:
          node-version-file: learnharness-mobile/.nvmrc
          cache: npm
          cache-dependency-path: |
            learnharness-mobile/package-lock.json
            learnharness/package-lock.json
      - name: Install the desktop fork (shared code and fixtures)
        working-directory: learnharness
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
      - name: Install the phone app
        working-directory: learnharness-mobile
        run: npm ci
      - name: Format check
        working-directory: learnharness-mobile
        run: npm run format:check
      - name: Lint
        working-directory: learnharness-mobile
        run: npm run lint
      - name: Typecheck
        working-directory: learnharness-mobile
        run: npm run typecheck
      - name: Tests
        working-directory: learnharness-mobile
        run: npm test -- --ci

  integration:
    name: Integration with the real fork server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: learnharness-mobile
      - uses: actions/checkout@v4
        with:
          repository: cnovelles/learnharness
          ref: mobile/phone-access
          path: learnharness
      # The fork's own CI runs its server on Node 26. Use the same here.
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            learnharness-mobile/package-lock.json
            learnharness/package-lock.json
      - name: Install the desktop fork
        working-directory: learnharness
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          npm run plugins:setup
      - name: Install the phone app
        working-directory: learnharness-mobile
        run: npm ci
      - name: Phone code against the real server (fake model)
        working-directory: learnharness-mobile
        run: npm run test:integration
